<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030406" />
    <meta
      name="description"
      content="K2Security — independent offensive security consultant. Penetration testing, red team operations, cloud security audits and incident response."
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      try {
        if (localStorage.getItem("k2-theme") === "light") {
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#eef3f0");
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=VT323&display=swap"
